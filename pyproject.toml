[project]
name = "mcp-generator"
version = "0.1.0"
description = "Auto-generate MCP servers from OpenAPI specs or database schemas"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "prance[osv]>=0.22",
    "mcp>=1.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
mcp-gen = "src.cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
